name: Publish NuGet

on:
    push:
        tags:
            - 'v*'

jobs:
    publish:
        runs-on: ubuntu-latest
        
        permissions:
            contents: read
            id-token: write
        
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'

            - name: Restore
              run: dotnet restore EasySpan.sln

            - name: Test
              run: dotnet test EasySpan.sln -c Release

            - name: Pack
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"

                  dotnet pack EasySpan/EasySpan.csproj \
                    -c Release \
                    -p:PackageVersion="$VERSION" \
                    -o ./artifacts

            - name: NuGet Login
              uses: NuGet/login@v1
              id: login
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Publish
              run: |
                  dotnet nuget push "./artifacts/*.nupkg" \
                    --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
                    --source https://api.nuget.org/v3/index.json \
                    --skip-duplicate
